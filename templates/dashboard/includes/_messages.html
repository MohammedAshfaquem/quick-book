<!-- Toast and Alert Messages Component -->
{% if messages %}
  {% for message in messages %}
    {% if message.tags == 'error' %}
      <div class="modal-backdrop" id="errorModal">
        <div class="modal-card">
          <div class="modal-header-icon error">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <h3 class="modal-title">Action Required</h3>
          <p class="modal-body-text">{{ message }}</p>
          <button type="button" class="btn btn-primary modal-action-btn" onclick="closeModal()">Dismiss</button>
        </div>
      </div>
    {% else %}
      <div class="alert alert-success">
        {{ message }}
      </div>
    {% endif %}
  {% endfor %}
{% endif %}
