<!-- Logout Confirmation Modal Component -->
<div class="modal-backdrop" id="logoutConfirmModal" style="display: none; opacity: 0; transition: opacity 0.2s ease;">
  <div class="modal-card" style="max-width: 420px; text-align: center;">
    <div class="modal-header-icon error">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </div>
    <h3 class="modal-title">Log Out of Dashboard?</h3>
    <p class="modal-body-text" style="color: #64748b; font-size: 0.92rem; margin-top: 0.5rem; margin-bottom: 1.75rem; line-height: 1.5;">
      Are you sure you want to log out of your staff admin session?
    </p>
    <div style="display: flex; gap: 0.75rem; justify-content: center;">
      <button type="button" class="btn btn-secondary" onclick="closeLogoutModal()" style="flex: 1;">Cancel</button>
      <a href="{% url 'dashboard:logout' %}" class="btn btn-primary" style="flex: 1; background: #dc2626; border-color: #dc2626; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Log Out</a>
    </div>
  </div>
</div>
