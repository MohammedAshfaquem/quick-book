<!-- Top Navigation Header Component -->
<header class="top-navbar">
  <div class="top-nav-left" style="display: flex; align-items: center; gap: 0.75rem;">
    <button type="button" class="mobile-menu-toggle" onclick="toggleMobileSidebar()" aria-label="Toggle Navigation">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="system-status-pill">
      <span class="status-dot"></span> System Live
    </span>
  </div>
  <div class="top-nav-right">
    <div class="top-user-profile">
      <div class="avatar-box">
        {{ request.user.email|slice:":1"|upper }}
      </div>
      <div class="top-user-details">
        <span class="user-email-text">{{ request.user.email }}</span>
        <span class="user-role-tag">{% if request.user.is_superuser %}Super Admin{% else %}Staff Admin{% endif %}</span>
      </div>
    </div>
  </div>
</header>
